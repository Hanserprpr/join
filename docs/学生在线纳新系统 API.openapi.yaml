  /api/statistics/overview:
    get:
      tags:
      - 数据统计
      summary: 获取管理员数据总览
      description: |
        按服务端解析的板块、工作站或部门范围返回全量报名聚合数据，不返回申请人或队列个人明细。
        需要 statistics:read，且整个组织范围必须属于调用者的服务端授权范围。
        报名按部门报名记录计数，学院分布基于全量报名；空学院归入“未知学院”。
        仅 DEPARTMENT 范围返回面试摘要，等待人数统计 PUBLISHED/ENDED 场次中状态为 WAITING 的队列项。
        业务码：成功 0，参数错误 40000，未登录 -4，登录失效 40101，越权 40103，组织不存在或已停用 140009。
      operationId: getStatisticsOverview
      parameters:
      - name: scopeType
        in: query
        description: 统计范围类型，必须使用固定大写值
        required: true
        schema:
          type: string
          enum:
          - BOARD
          - WORKSTATION
          - DEPARTMENT
      - name: scopeId
        in: query
        description: 板块、工作站或部门 ID
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: 成功或已包装的业务错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultDashboardOverviewVO"
        "400":
          description: 请求参数无效
        "401":
          description: 未登录或登录状态失效
        "403":
          description: 没有统计权限或组织范围越权
        "500":
          description: 服务内部异常
      security:
      - sessionCookie: []
