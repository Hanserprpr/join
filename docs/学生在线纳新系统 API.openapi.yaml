components:
  schemas:
    DashboardScopeVO:
      type: object
      description: 统计所属的组织范围
      required:
      - type
      - id
      - name
      - departmentCount
      properties:
        type:
          type: string
          enum: [BOARD, WORKSTATION, DEPARTMENT]
        id:
          type: integer
          format: int64
        name:
          type: string
        departmentCount:
          type: integer
          format: int32
          minimum: 0
    DashboardDepartmentApplicationVO:
      type: object
      description: 范围内部门报名数量，包含零报名部门
      required:
      - departmentId
      - departmentName
      - workstationId
      - workstationName
      - applicationCount
      properties:
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        workstationId:
          type: integer
          format: int64
        workstationName:
          type: string
        applicationCount:
          type: integer
          format: int64
          minimum: 0
    DashboardCollegeDistributionVO:
      type: object
      description: 全量报名的学院分布
      required:
      - college
      - applicationCount
      properties:
        college:
          type: string
        applicationCount:
          type: integer
          format: int64
          minimum: 0
    DashboardApplicationStatisticsVO:
      type: object
      description: 报名聚合统计
      required:
      - total
      - departmentsWithApplications
      - averagePerDepartment
      - byDepartment
      - byCollege
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: 范围内报名记录总数，不按学生去重
        departmentsWithApplications:
          type: integer
          format: int32
          minimum: 0
        averagePerDepartment:
          type: number
          format: double
          minimum: 0
        byDepartment:
          type: array
          items:
            $ref: "#/components/schemas/DashboardDepartmentApplicationVO"
        byCollege:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCollegeDistributionVO"
    DashboardHighlightedSessionVO:
      type: object
      description: 按 startsAt、sessionId 升序选中的第一个已发布场次
      required:
      - sessionId
      - name
      - location
      - startsAt
      - endsAt
      - status
      properties:
        sessionId:
          type: integer
          format: int64
        name:
          type: [string, "null"]
        location:
          type: [string, "null"]
        startsAt:
          type: [string, "null"]
          format: date-time
        endsAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          const: PUBLISHED
    DashboardInterviewStatisticsVO:
      type: object
      description: 部门面试现场运营摘要
      required:
      - publishedSessionCount
      - operationalSessionCount
      - highlightedSession
      - waitingCount
      properties:
        publishedSessionCount:
          type: integer
          format: int32
          minimum: 0
        operationalSessionCount:
          type: integer
          format: int32
          minimum: 0
          description: PUBLISHED/ENDED 场次数
        highlightedSession:
          oneOf:
          - $ref: "#/components/schemas/DashboardHighlightedSessionVO"
          - type: "null"
        waitingCount:
          type: integer
          format: int64
          minimum: 0
          description: PUBLISHED/ENDED 场次中 WAITING 队列项总数
    DashboardOverviewVO:
      type: object
      description: 管理员数据总览聚合统计
      required:
      - scope
      - applications
      - interviews
      - generatedAt
      properties:
        scope:
          $ref: "#/components/schemas/DashboardScopeVO"
        applications:
          $ref: "#/components/schemas/DashboardApplicationStatisticsVO"
        interviews:
          description: 仅 DEPARTMENT 返回对象，其他范围固定为 null
          oneOf:
          - $ref: "#/components/schemas/DashboardInterviewStatisticsVO"
          - type: "null"
        generatedAt:
          type: string
          format: date-time
          description: ISO 8601 时间，包含时区偏移
    ResultDashboardOverviewVO:
      type: object
      required:
      - code
      - data
      - msg
      - timestamp
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/DashboardOverviewVO"
        msg:
          type: string
        timestamp:
          type: integer
          format: int64
    ContactUpdateRequest:
      type: object
      description: |
        部分更新：字段缺省或显式传 null 表示不修改，因此每个字段都接受 null。
        选填字段（email、qq）额外支持传空字符串，表示把该字段清空为 NULL。
        必填字段（phone、college、major、grade）不支持清空。
      properties:
        campus:
          description: 学生所在校区；历史资料可为 null。更新资料时缺省或 null 表示不修改。
          type: [string, "null"]
          enum: [SOFTWARE_PARK, CENTRAL, QIANFOSHAN, XINGLONGSHAN, HONGJIALOU, BAOTUQUAN, null]
        email:
          description: |
            邮箱。空字符串表示清空；null 或缺省表示不修改。
            空字符串不是合法邮箱，故用 oneOf 把“清空”与“合法邮箱”分开描述，
            避免 format: email 把文档承诺支持的清空请求判为非法。
          oneOf:
          - type: "null"
          - type: string
            const: ""
          - type: string
            format: email
            pattern: ^\S+@\S+\.\S+$
        phone:
          description: 手机号；不支持清空，空字符串不满足 pattern 会被拒绝
          type:
          - string
          - "null"
          pattern: "^1\\d{10}$"
        college:
          type:
          - string
          - "null"
          maxLength: 64
          minLength: 0
        major:
          type:
          - string
          - "null"
          maxLength: 64
          minLength: 0
        grade:
          type:
          - integer
          - "null"
          format: int32
          maximum: 2100
          minimum: 2000
        qq:
          description: QQ 号。空字符串表示清空；null 或缺省表示不修改
          type:
          - string
          - "null"
          pattern: "^(?:[1-9]\\d{4,11})?$"
    ResultUserProfileVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/UserProfileVO"
        msg:
          type: string
        timestamp:
          type: integer
          format: int64
    ResultPosterUploadVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/PosterUploadVO"
        msg:
          type: string
        timestamp:
          type: integer
          format: int64
    PosterUploadVO:
      type: object
      properties:
        url:
          type: string
          format: uri
    UserProfileVO:
      type: object
      properties:
        campus:
          description: 学生所在校区；历史资料可为 null。更新资料时缺省或 null 表示不修改。
          type: [string, "null"]
          enum: [SOFTWARE_PARK, CENTRAL, QIANFOSHAN, XINGLONGSHAN, HONGJIALOU, BAOTUQUAN, null]
        sub:
          type: string
        name:
          type: string
        casId:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        wechatBound:
          type: boolean
        profileCompleted:
          type: boolean
        qq:
          type: string
        college:
          type: string
        major:
          type: string
        grade:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DepartmentDetailUpdateRequest:
      type: object
      properties:
        campuses:
          type: array
          items:
            type: string
            enum:
            - SOFTWARE_PARK
            - CENTRAL
            - QIANFOSHAN
            - XINGLONGSHAN
            - HONGJIALOU
            - BAOTUQUAN
        introduction:
          type: string
          maxLength: 10000
          minLength: 0
        posters:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentPosterRequest"
          maxItems: 20
          minItems: 0
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentAchievementRequest"
          maxItems: 50
          minItems: 0
        recruitmentRequirements:
          type: string
          maxLength: 10000
          minLength: 0
        contact:
          type: string
          maxLength: 1000
          minLength: 0
        recruitmentGroup:
          type: string
          maxLength: 1000
          minLength: 0
    DepartmentPosterRequest:
      type: object
      description: >-
        海报写入项，id 与 url 必须恰好提供其中之一。传 id 表示保留该已有海报，
        服务端沿用库中地址，调用方无需回传详情接口返回的预签名 URL；
        传 url 表示新增海报，取值必须是上传接口返回的白名单地址。
        提交时未出现在数组中的已有海报会被删除，因此一次提交即可完成删除、
        新增与调序。
      properties:
        id:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: 已有海报 ID，表示保留该海报
        url:
          type: string
          maxLength: 2048
          minLength: 0
          description: 新增海报地址，取自上传接口返回值
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          description: 排序值，不传时按请求数组下标排序
      oneOf:
      - required:
        - id
      - required:
        - url
    DepartmentPosterOrderUpdateRequest:
      type: object
      description: 海报调序的全量请求；posters 必须覆盖部门当前全部海报。
      properties:
        posters:
          type: array
          minItems: 0
          maxItems: 20
          items:
            $ref: "#/components/schemas/DepartmentPosterOrderItemRequest"
      required:
      - posters
    DepartmentPosterOrderItemRequest:
      type: object
      properties:
