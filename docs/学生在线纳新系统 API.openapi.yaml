openapi: 3.1.0
info:
  title: 学生在线纳新系统 API
  description: 学生在线纳新系统后端接口
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/user/applications:
    get:
      tags:
      - 部门报名
      summary: 获取我的全部报名记录
      operationId: findMyApplications
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListMyApplicationVO"
      security:
      - sessionCookie: []
  /api/user/profile:
    get:
      tags:
      - 个人资料
      summary: 获取个人资料
      operationId: profile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserProfileVO"
      security:
      - sessionCookie: []
    put:
      tags:
      - 个人资料
      summary: 更新联系方式
      operationId: updateContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserProfileVO"
      security:
      - sessionCookie: []
  /api/user/profile/avatar:
    post:
      tags:
      - 个人资料
      summary: 上传或替换头像
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功，返回更新后的完整个人资料
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserProfileVO"
        "400":
          description: 文件为空、格式不支持或图片无效
        "413":
          description: 文件超过大小限制
        "503":
          description: ClamAV 扫描服务或对象存储暂时不可用
      security:
      - sessionCookie: []
  /api/departments/{departmentId}:
    get:
      tags:
      - 部门
      summary: 获取部门详情
      operationId: getDepartment
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentVO"
    put:
      tags:
      - 部门
      summary: 完整更新部门详情
      operationId: updateDepartment
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentDetailUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentVO"
      security:
      - sessionCookie: []
    patch:
      tags:
      - 部门
      summary: 部分更新部门详情
      operationId: patchDepartment
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentDetailPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/posters/upload:
    post:
      tags:
      - 部门
      summary: 上传部门海报图片
      description: 需要当前用户对该部门拥有 RECRUITMENT_MANAGE 权限。上传成功后返回可写入 posters 字段的稳定白名单 URL；查询部门详情时，S3 海报 URL 会转换为预签名读取 URL。
      operationId: uploadPoster
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultPosterUploadVO"
        "400":
          description: 图片格式或内容无效
        "403":
          description: 无部门管理权限
        "413":
          description: 文件超过大小限制
        "503":
          description: ClamAV 或对象存储暂时不可用
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/achievements/images/upload:
    post:
      tags:
      - 部门
      summary: 上传部门成果图片
      description: 需要当前用户对该部门拥有 RECRUITMENT_MANAGE 权限。上传成功后返回可写入成果 imageUrls 数组的 URL。
      operationId: uploadAchievementImage
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultPosterUploadVO"
        "400":
          description: 图片格式或内容无效
        "403":
          description: 无部门管理权限
        "413":
          description: 文件超过大小限制
        "503":
          description: ClamAV 或对象存储暂时不可用
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/posters/order:
    put:
      tags:
      - 部门
      summary: 更新部门海报顺序
      description: |
        需要当前用户对该部门拥有 RECRUITMENT_MANAGE 权限。
        请求必须包含该部门当前全部海报的 ID，ID 不得重复；sortOrder 不得重复，
        且必须恰好组成 0..n-1 的连续整数序列。请求数组的元素顺序不影响结果。
        空数组仅在该部门当前没有海报时有效。
        若请求中的海报 ID 集合与部门当前海报不一致，返回业务码 140036（海报列表已变化，请刷新后重试）。
      operationId: updatePosterOrder
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentPosterOrderUpdateRequest"
      responses:
        "200":
          description: 更新成功；重复 ID、重复或不连续的 sortOrder 返回业务码 40000，海报列表已变化返回业务码 140036
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListDepartmentPosterVO"
        "400":
          description: 请求体格式错误、字段缺失，或 id、sortOrder 超出允许范围
        "403":
          description: 无部门管理权限
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/questionnaire:
    get:
      tags:
      - 部门
      summary: 获取部门报名问卷
      operationId: getQuestionnaire
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentQuestionnaireVO"
      security:
      - sessionCookie: []
    put:
      tags:
      - 部门
      summary: 完整更新部门报名问卷
      operationId: updateQuestionnaire
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentQuestionnaireUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentQuestionnaireVO"
      security:
      - sessionCookie: []
    delete:
      tags:
      - 部门
      summary: 清空部门报名问卷
      operationId: clearQuestionnaire
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentQuestionnaireVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interviews/{interviewId}/evaluation:
    put:
      tags:
      - 面试
      summary: 更新面试评价
      operationId: updateEvaluation
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: interviewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewEvaluationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewEvaluationVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interviews/sessions/{sessionId}:
    put:
      tags:
      - 面试
      summary: 修改面试场次
      operationId: updateSession
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewSessionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewSessionVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interviews/queue-config:
    get:
      tags:
      - 面试
      summary: 查询部门全局过号配置
      description: 该配置作用于部门下的所有面试场次。
      operationId: findQueueConfig
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewQueueConfigVO"
      security:
      - sessionCookie: []
    put:
      tags:
      - 面试
      summary: 完整更新部门全局过号配置
      description: 完整更新部门下所有面试场次共用的过号处理方式、顺延人数和最大过号次数。
      operationId: updateQueueConfig
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewQueueConfigRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewQueueConfigVO"
      security:
      - sessionCookie: []
    patch:
      tags:
      - 面试
      summary: 部分更新部门全局过号配置
      description: 仅更新请求中提供的字段；配置作用于部门下的所有面试场次。
      operationId: patchQueueConfig
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewQueueConfigPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewQueueConfigVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/applications/{applicationId}/admission:
    put:
      tags:
      - 部门报名
      operationId: admit
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: applicationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentApplicationVO"
      security:
      - sessionCookie: []
    delete:
      tags:
      - 部门报名
      operationId: cancelAdmissionDraft
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: applicationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultDepartmentApplicationVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interviews/sessions:
    get:
      tags:
      - 面试
      summary: 查询可见面试场次（管理员全部，普通用户仅已发布）
      operationId: findSessions
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListInterviewSessionVO"
      security:
      - sessionCookie: []
    post:
      tags:
      - 面试
      summary: 创建面试场次
      operationId: createSession
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewSessionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewSessionVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interviews/sessions/{sessionId}/publish:
    post:
      tags:
      - 面试
      summary: 发布面试场次
      operationId: publishSession
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewSessionVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interviews/sessions/{sessionId}/end:
    post:
      tags:
      - 面试
      summary: 结束面试场次
      operationId: endSession
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewSessionVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms:
    get:
      tags:
      - DepartmentInterviewRoomController
      operationId: findBySession
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: sessionId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListInterviewRoomVO"
      security:
      - sessionCookie: []
    post:
      tags:
      - DepartmentInterviewRoomController
      operationId: create
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewRoomRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewRoomVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/leave:
    post:
      tags:
      - DepartmentInterviewRoomController
      operationId: leave
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewRoomVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/join:
    post:
      tags:
      - DepartmentInterviewRoomController
      operationId: join
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewRoomVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/force-call-next:
    post:
      tags:
      - DepartmentInterviewRoomController
      summary: 强制结束并呼叫下一位
      operationId: forceCallNext
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewRoomStateVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/current/stop-calling:
    post:
      tags:
      - DepartmentInterviewRoomController
      summary: 停止面试室叫号
      operationId: stopCalling
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewQueueItemVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/current/pass:
    post:
      tags:
      - DepartmentInterviewRoomController
      summary: 将面试室当前面试者标记为过号
      operationId: pass
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewQueueItemVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/current/force-finish:
    post:
      tags:
      - DepartmentInterviewRoomController
      summary: 强制结束面试室当前面试
      operationId: forceFinish
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewRoomStateVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/current/finish:
    post:
      tags:
      - DepartmentInterviewRoomController
      summary: 结束面试室当前面试
      operationId: finish
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewRoomStateVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/current/evaluation:
    post:
      tags:
      - DepartmentInterviewRoomController
      summary: 提交管理员独立评价
      operationId: submitEvaluation
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewEvaluationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultInterviewRoomStateVO"
      security:
      - sessionCookie: []
  /api/departments/{departmentId}/interview-rooms/{roomId}/close:
    post:
      tags:
      - DepartmentInterviewRoomController
      operationId: close
      parameters:
