  /api/user/applications:
    get:
      tags:
      - 部门报名
      summary: 获取我的全部报名记录
      operationId: findMyApplications
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListMyApplicationVO"
      security:
      - sessionCookie: []
  /api/user/profile:
    get:
      tags:
      - 个人资料
      summary: 获取个人资料
      operationId: profile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserProfileVO"
      security:
      - sessionCookie: []
    put:
      tags:
      - 个人资料
      summary: 更新联系方式
      operationId: updateContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultUserProfileVO"
      security:
      - sessionCookie: []
