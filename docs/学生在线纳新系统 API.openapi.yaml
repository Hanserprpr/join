components:
  schemas:
    ContactUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^\S+@\S+\.\S+$
        phone:
          type: string
          pattern: "^1\\d{10}$"
        college:
          type: string
          maxLength: 64
          minLength: 0
        major:
          type: string
          maxLength: 64
          minLength: 0
        grade:
          type: integer
          format: int32
          maximum: 2100
          minimum: 2000
        qq:
          type: string
          pattern: "^(?:[1-9]\\d{4,11})?$"
    ResultUserProfileVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/UserProfileVO"
        msg:
          type: string
        timestamp:
          type: integer
          format: int64
    UserProfileVO:
      type: object
      properties:
        sub:
          type: string
        name:
          type: string
        casId:
          type: string
        email:
          type: string
        phone:
          type: string
        wechatBound:
          type: boolean
        profileCompleted:
          type: boolean
        qq:
          type: string
        college:
          type: string
        major:
          type: string
        grade:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DepartmentDetailUpdateRequest:
      type: object
      properties:
        campus:
          type: string
          enum:
          - SOFTWARE_PARK
          - CENTRAL
          - QIANFOSHAN
          - XINGLONGSHAN
          - HONGJIALOU
          - BAOTUQUAN
        introduction:
          type: string
          maxLength: 10000
          minLength: 0
        posters:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentPosterRequest"
          maxItems: 20
          minItems: 0
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentAchievementRequest"
          maxItems: 50
          minItems: 0
        recruitmentRequirements:
          type: string
          maxLength: 10000
          minLength: 0
        contact:
          type: string
          maxLength: 1000
          minLength: 0
        recruitmentGroup:
          type: string
          maxLength: 1000
          minLength: 0
    DepartmentPosterRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
          minLength: 0
        sortOrder:
          type: integer
          format: int32
          minimum: 0
      required:
      - url
    DepartmentAchievementRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        content:
          type: string
          maxLength: 5000
          minLength: 0
      required:
      - title
    DepartmentPosterVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        sortOrder:
          type: integer
          format: int32
    DepartmentAchievementVO:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
    DepartmentVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        workstationId:
          type: integer
          format: int64
        name:
          type: string
        campus:
          type: string
          enum:
          - SOFTWARE_PARK
          - CENTRAL
          - QIANFOSHAN
          - XINGLONGSHAN
          - HONGJIALOU
          - BAOTUQUAN
        introduction:
          type: string
        posters:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentPosterVO"
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentAchievementVO"
        recruitmentRequirements:
          type: string
        contact:
          type: string
        recruitmentGroup:
          type: string
        hasQuestionnaire:
          type: boolean
        canManage:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        enabled:
          type: boolean
    ResultDepartmentVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/DepartmentVO"
        msg:
          type: string
        timestamp:
          type: integer
          format: int64
    DepartmentQuestionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        type:
          type: string
          enum:
          - SINGLE_CHOICE
          - MULTIPLE_CHOICE
          - SHORT_TEXT
          - LONG_TEXT
        required:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOptionRequest"
          maxItems: 50
          minItems: 0
        optionsValid:
          type: boolean
      required:
      - required
      - title
      - type
    DepartmentQuestionnaireUpdateRequest:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentQuestionRequest"
          maxItems: 100
          minItems: 0
      required:
      - questions
    QuestionOptionRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - content
    DepartmentQuestionVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - SINGLE_CHOICE
          - MULTIPLE_CHOICE
          - SHORT_TEXT
          - LONG_TEXT
        required:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOptionVO"
    DepartmentQuestionnaireVO:
      type: object
      properties:
        departmentId:
          type: integer
          format: int64
        configured:
          type: boolean
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentQuestionVO"
    QuestionOptionVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        sortOrder:
          type: integer
          format: int32
    ResultDepartmentQuestionnaireVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/DepartmentQuestionnaireVO"
        msg:
          type: string
        timestamp:
          type: integer
          format: int64
    InterviewEvaluationRequest:
      type: object
