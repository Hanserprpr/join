  /api/departments/{departmentId}/applications:
    get:
      tags:
      - 部门报名
      summary: 分页查询部门报名信息
      operationId: findApplications
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - name: college
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: grade
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 2100
          minimum: 2000
      - name: interviewed
        in: query
        required: false
        schema:
          type: boolean
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: submittedAt
          pattern: submittedAt|score
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: desc
          pattern: asc|desc
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultPageVODepartmentApplicationSummaryVO"
      security:
      - sessionCookie: []
    post:
      tags:
      - 部门报名
      summary: 提交部门报名
      operationId: submit
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
