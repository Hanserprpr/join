    InterviewEvaluationVO:
      type: object
      properties:
        interviewId:
          type: integer
          format: int64
        administratorCasId:
          type: string
        administratorName:
          type: string
        score:
          type: integer
          format: int32
        evaluation:
          type: string
        submittedAt:
          type: string
          format: date-time
    ResultInterviewEvaluationVO:
      type: object
      properties:
