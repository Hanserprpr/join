spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: join
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:11MB}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/join?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # 启动时自动执行 classpath:db/migration 下的迁移脚本
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 引入 Flyway 之前就存在的库：非空且没有迁移历史时，直接基线到 V1，
    # 只补跑 V1 之后的脚本，不会重复建表。
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: schema before flyway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
  security:
    oauth2:
      client:
        registration:
          sdu:
            provider: sdu
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-name: SDU OIDC
            authorization-grant-type: authorization_code
            redirect-uri: ${OIDC_REDIRECT_URI:https://join.sduonline.cn/api/login/oauth2/code/sdu}
            # IdP scopes_supported: openid, profile
            scope:
              - openid
              - profile
            client-authentication-method: client_secret_basic
        provider:
          sdu:
            # 不使用 issuer-uri 自动发现，避免代理环境改写元数据中的端点域名
            authorization-uri: https://i.sdu.edu.cn/pass-api/auth/oidc/authorize
            token-uri: https://i.sdu.edu.cn/pass-api/auth/oidc/token
            user-info-uri: https://i.sdu.edu.cn/pass-api/auth/oidc/userinfo
            jwk-set-uri: https://i.sdu.edu.cn/pass-api/auth/oidc/jwks
            user-name-attribute: sub

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input
      table-underline: true

sa-token:
  cookie:
    # 跨站请求需携带 Cookie，改为 None 并配合 secure（localhost 视为安全上下文）
    same-site: None
    secure: true

server:
  port: ${SERVER_PORT:8080}
  # 使用反向代理传入的 X-Forwarded-* 信息生成 HTTPS 公网地址
  forward-headers-strategy: framework
  tomcat:
    # SSE 为长连接，每个连接占用一个连接槽位；默认 8192 会先于内存成为瓶颈。
    # 按 20000 起步，部署时按需调大（注意操作系统文件句柄限制）。
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:20000}
    threads:
      # SSE 异步不长期占用线程，但其他业务仍需要；默认 200 一般够用
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        name: JOINSESSION
        # 跨站请求需携带 Cookie，改为 none 并配合 secure（localhost 视为安全上下文）
        same-site: none
        secure: true
        http-only: true

app:
  avatar:
    storage: ${AVATAR_STORAGE:local}
    local-directory: ${AVATAR_LOCAL_DIRECTORY:./data/avatars}
    public-base-url: ${AVATAR_PUBLIC_BASE_URL:}
    max-size-bytes: ${AVATAR_MAX_SIZE_BYTES:2097152}
    s3:
      endpoint: ${AVATAR_S3_ENDPOINT:}
      region: ${AVATAR_S3_REGION:us-east-1}
      access-key: ${AVATAR_S3_ACCESS_KEY:}
      secret-key: ${AVATAR_S3_SECRET_KEY:}
      bucket: ${AVATAR_S3_BUCKET:}
      public-base-url: ${AVATAR_S3_PUBLIC_BASE_URL:}
      path-style-access: ${AVATAR_S3_PATH_STYLE_ACCESS:true}
      presigned-url-ttl-seconds: ${AVATAR_S3_PRESIGNED_URL_TTL_SECONDS:3600}
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:127.0.0.1}
    port: ${CLAMAV_PORT:3310}
    connect-timeout-ms: ${CLAMAV_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CLAMAV_READ_TIMEOUT_MS:5000}
  poster:
    local-directory: ${POSTER_LOCAL_DIRECTORY:./data/posters}
    public-base-url: ${POSTER_PUBLIC_BASE_URL:}
    max-size-bytes: ${POSTER_MAX_SIZE_BYTES:10485760}
    allowed-url-prefixes: ${POSTER_ALLOWED_URL_PREFIXES:}
  admission-email:
    enabled: ${ADMISSION_EMAIL_ENABLED:false}
    poll-delay-ms: ${ADMISSION_EMAIL_POLL_DELAY_MS:5000}
  # 登录成功后回跳的前端地址
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # 允许的跨域来源，多个用逗号分隔
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  check-in:
    token-ttl-seconds: ${CHECK_IN_TOKEN_TTL_SECONDS:8}
    qr-refresh-seconds: ${CHECK_IN_QR_REFRESH_SECONDS:8}
    entry-url: ${CHECK_IN_ENTRY_URL:http://localhost:8080/api/wechat/check-in/entry}
    result-url: ${CHECK_IN_RESULT_URL:${FRONTEND_URL:http://localhost:5173}/check-in}
    oauth-state-ttl-seconds: ${CHECK_IN_OAUTH_STATE_TTL_SECONDS:120}
  external-identity:
    base-url: ${EXTERNAL_IDENTITY_BASE_URL:https://i.sdu.edu.cn}
    cache-ttl-seconds: ${EXTERNAL_IDENTITY_CACHE_TTL_SECONDS:60}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    oauth-callback-url: ${WECHAT_OAUTH_CALLBACK_URL:http://localhost:8080/api/wechat/binding/callback}
    binding-result-url: ${WECHAT_BINDING_RESULT_URL:http://localhost:5173/wechat-binding}
    binding-state-ttl-seconds: ${WECHAT_BINDING_STATE_TTL_SECONDS:600}
    login-oauth-callback-url: ${WECHAT_LOGIN_OAUTH_CALLBACK_URL:http://localhost:8080/api/wechat/login/callback}
    login-result-url: ${WECHAT_LOGIN_RESULT_URL:${FRONTEND_URL:http://localhost:5173}}
    login-state-ttl-seconds: ${WECHAT_LOGIN_STATE_TTL_SECONDS:300}
    binding-template-id: ${WECHAT_BINDING_TEMPLATE_ID:}
    interview-call-template-id: ${WECHAT_INTERVIEW_CALL_TEMPLATE_ID:79icrV3YXPf6_FRxqDLgzGsyW1QNU-X-1IFk1j48LKw}
    # 服务号后台选用的订阅通知模板 ID，多个用逗号分隔
    subscribe-template-ids: ${WECHAT_SUBSCRIBE_TEMPLATE_IDS:${WECHAT_INTERVIEW_CALL_TEMPLATE_ID:79icrV3YXPf6_FRxqDLgzGsyW1QNU-X-1IFk1j48LKw}}
    # 仅为这些前端 Origin 生成 JS-SDK 签名，多个用逗号分隔
    js-sdk-allowed-origins: ${WECHAT_JS_SDK_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
    ticket-refresh-ahead-seconds: ${WECHAT_TICKET_REFRESH_AHEAD_SECONDS:300}
    system-name: ${WECHAT_SYSTEM_NAME:学生在线纳新系统}
    # access_token 默认有效 7200 秒，提前刷新以避免临界时间请求失败
    token-refresh-ahead-seconds: ${WECHAT_TOKEN_REFRESH_AHEAD_SECONDS:300}
    proxy:
      enabled: ${WECHAT_PROXY_ENABLED:false}
      host: ${WECHAT_PROXY_HOST:127.0.0.1}
      port: ${WECHAT_PROXY_PORT:8080}
      connect-timeout-ms: ${WECHAT_PROXY_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${WECHAT_PROXY_READ_TIMEOUT_MS:10000}

springdoc:
  api-docs:
    path: /v3/api-docs
